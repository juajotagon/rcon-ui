name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# id-token and attestations exist for the provenance steps: every artifact is
# signed via GitHub's Sigstore integration, so a download can be verified with
# `gh attestation verify <file> --repo juajotagon/rcon-ui`. This is supply-chain
# provenance, not Authenticode -- SmartScreen still warns until a code-signing
# certificate exists.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # The desktop app cannot cross-compile: Wails links the target OS's native
  # webview (WebKitGTK on Linux, WebView2 on Windows), so each artifact has to
  # be produced on its own runner. This matrix is not an optimisation -- a
  # single-host build simply cannot work.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-amd64
            binary: rcon-ui-desktop
          - os: windows-latest
            target: windows-amd64
            binary: rcon-ui-desktop.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Ubuntu 22.04 ships webkit2gtk-4.0; newer releases ship only 4.1. The
      # Makefile detects which is present, so the build follows whichever the
      # runner provides.
      - name: Install webview headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build frontend
        shell: bash
        run: cd web && npm ci --prefer-offline --no-audit --fund=false && npm run build

      # Deliberately not `make desktop` on Windows. That target shells out to
      # pkg-config and grep to detect the WebKitGTK version, none of which exist
      # on a Windows runner -- and Windows uses WebView2 regardless, so there is
      # no version to detect. Invoking go build directly keeps the Makefile
      # honest as a Linux/macOS convenience rather than pretending to be
      # cross-platform.
      #
      # UNVERIFIED: this workflow has never been executed. The Windows job in
      # particular is reasoned about, not observed. Run it via workflow_dispatch
      # before trusting a tag to produce Windows artifacts.
      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -tags desktop,production \
            -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME:-dev}" \
            -o bin/rcon-ui-desktop.exe ./cmd/rcon-ui-desktop

      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        run: make desktop

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: rcon-ui-desktop-${{ matrix.target }}
          path: bin/${{ matrix.binary }}
          if-no-files-found: error

  # The headless daemon is CGO-free, so every target builds from one runner.
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make ui

      - name: Cross-compile daemon
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/rcon-ui-${os}-${arch}${ext}" ./cmd/rcon-ui
          done
          ls -la dist/

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: rcon-ui-daemon
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [desktop, daemon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -exec sha256sum {} \; | sed 's| \./[^/]*/| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS
          # Published immediately rather than as a draft: tags are only pushed
          # deliberately, and the point of a release is a public download link
          # on the repository page without a second manual step.
          draft: false
          # Not Authenticode-signed, so Windows SmartScreen and macOS
          # Gatekeeper will warn on first run. Saying so in the release notes
          # is the minimum; an OS-trusted certificate is a later cost decision.
          # Every artifact does carry Sigstore build provenance, which proves
          # what built it from what source.
          body: |
            - `rcon-ui-desktop-*` — the desktop app
            - `rcon-ui-*` — the headless daemon

            **Verify a download** (proves it was built by this repo's release
            workflow from this source):

            ```
            gh attestation verify <file> --repo juajotagon/rcon-ui
            sha256sum --check --ignore-missing SHA256SUMS
            ```

            Binaries are not Authenticode-signed, so Windows SmartScreen and
            macOS Gatekeeper will warn on first run — expected until OS code
            signing is set up.
