{{- include "rcon-ui.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rcon-ui.fullname" . }}
  labels: {{- include "rcon-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # SQLite on a ReadWriteOnce volume: the old pod must release the volume
    # before the new one can attach it, so a rolling update would deadlock.
    type: Recreate
  selector:
    matchLabels: {{- include "rcon-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rcon-ui.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the token or sealing key changes; otherwise a
        # rotated secret sits unused until something else triggers a restart.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile: {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
      containers:
        - name: rcon-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities: {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RCON_UI_ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: RCON_UI_DATA_DIR
              value: /data
            - name: RCON_UI_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: RCON_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "rcon-ui.fullname" .) }}
                  key: {{ .Values.auth.tokenKey }}
            {{- if or .Values.sealingKey.value .Values.sealingKey.existingSecret }}
            - name: RCON_UI_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sealingKey.existingSecret | default (include "rcon-ui.fullname" .) }}
                  key: {{ .Values.sealingKey.key }}
            {{- end }}
          # Liveness and readiness are the same check here: the daemon either
          # serves HTTP or it does not. A game server being unreachable is not
          # an rcon-ui fault and must never restart the pod -- that would turn
          # someone else's outage into a crash loop.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.securityContext.readOnlyRootFilesystem }}
            # SQLite writes temporary files, and a read-only root filesystem
            # would otherwise make it fail at runtime rather than at startup.
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rcon-ui.fullname" . }}-data
          {{- else }}
          # Ephemeral: every profile and password is lost when the pod restarts.
          emptyDir: {}
          {{- end }}
        {{- if .Values.securityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
