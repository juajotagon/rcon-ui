{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rcon-ui.fullname" . }}
  labels: {{- include "rcon-ui.labels" . | nindent 4 }}
  annotations:
    # Server-Sent Events must not be buffered or the console never updates.
    # nginx buffers proxied responses by default; the daemon also sets
    # X-Accel-Buffering, but an explicit annotation survives controllers that
    # ignore the header.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    {{- with .Values.ingress.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "rcon-ui.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
