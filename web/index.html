<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rcon-ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Diagnostic beacon: a production Wails build exposes no devtools, so an
      // exception in the bundle is otherwise completely invisible. Encoding the
      // message into a URL means the server access log captures it with no
      // endpoint required.
      window.addEventListener("error", function (e) {
        fetch("/__clienterror?m=" + encodeURIComponent(e.message + " @ " + e.filename + ":" + e.lineno));
      });
      window.addEventListener("unhandledrejection", function (e) {
        fetch("/__clienterror?m=" + encodeURIComponent("rejection: " + e.reason));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
